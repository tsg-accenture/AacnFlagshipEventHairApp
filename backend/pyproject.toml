[project]
name = "crown-ai-backend"
version = "0.1.0"
description = "Crown AI API: accounts, consent, Hair Rhythm, rules, Hair Coach and photo checks. Holds the OpenAI key."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.151.0",
    "uvicorn[standard]==0.54.0",
    "openai==3.35.1",
    "sqlalchemy==2.1.5",
    "alembic==1.20.0",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.0",
    "pwdlib[argon2]==0.3.1",
    "pyjwt==2.15.1",
    "pillow==13.0.0",
    "reportlab==5.0.1",
    "pyyaml==6.0.3",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
